<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b8cf0"/>
      <stop offset="100%" stop-color="#1a4fa0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Glass shine -->
  <rect width="64" height="32" rx="14" fill="url(#shine)"/>

  <!-- Graduation cap — diamond (top view) -->
  <polygon points="32,11 48,21 32,31 16,21" fill="white" opacity="0.95"/>
  <!-- Cap center highlight -->
  <polygon points="32,15 42,21 32,27 22,21" fill="rgba(59,140,240,0.35)"/>

  <!-- Stem -->
  <rect x="30.5" y="31" width="3" height="10" rx="1.5" fill="white" opacity="0.9"/>

  <!-- Campus arch / building -->
  <path d="M18 54 Q18 44 26 44 L38 44 Q46 44 46 54" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>
  <!-- Door -->
  <path d="M29 54 Q29 49 32 49 Q35 49 35 54" fill="white" opacity="0.6"/>
  <!-- Columns -->
  <rect x="20" y="44" width="2.2" height="10" rx="1.1" fill="white" opacity="0.55"/>
  <rect x="41.8" y="44" width="2.2" height="10" rx="1.1" fill="white" opacity="0.55"/>

  <!-- Orange accent dot (connectivity / notification) -->
  <circle cx="48" cy="13" r="5" fill="#f5a142"/>
  <circle cx="48" cy="13" r="3" fill="#ffcc80"/>
</svg>
